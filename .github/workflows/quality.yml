name: Quality
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Verified commit to test for release preparation
        type: string
        required: false
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax, including bootstrap and tests
        run: |
          php -l quixdevs-stocknotifier.php
          php -l uninstall.php
          find includes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - run: composer lint
      - name: Packaging and draft-release safeguards
        run: python3 -m unittest discover -s tests/Packaging -v
      - name: Verify listing screenshot copies
        run: python3 bin/build-directory-assets.py --check
      - run: python3 bin/build-release.py
      - run: python3 bin/validate-release.py
      - name: Save runtime package for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stocknotifier-runtime-php-${{ matrix.php }}
          path: |
            dist/quixdevs-stocknotifier.zip
            dist/quixdevs-stocknotifier.zip.sha256
            dist/quixdevs-stocknotifier-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
